<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oficina & Peças do Tio</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Arquivo CSS Separado -->
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-900 text-slate-100 font-sans pb-24 md:pb-8 select-none">

    <!-- Cabeçalho Fixo -->
    <header class="bg-slate-800 border-b border-slate-700 sticky top-0 z-40 shadow-lg">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div class="flex items-center gap-2">
                <div class="bg-red-600 text-white p-2 rounded-xl flex items-center justify-center">
                    <i class="fa-solid fa-motorcycle text-lg"></i>
                </div>
                <div>
                    <h1 class="text-base font-bold text-white leading-tight">Peças do Tio</h1>
                    <span class="text-[11px] text-slate-400 block">Oficina & Autopeças</span>
                </div>
            </div>

            <div class="flex items-center gap-2">
                <button onclick="abrirPainelAdm()" class="bg-slate-700 active:bg-slate-600 text-slate-200 px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 border border-slate-600">
                    <i class="fa-solid fa-lock text-red-400"></i> Painel
                </button>
                <button onclick="toggleCarrinho()" class="bg-red-600 active:bg-red-700 text-white px-3.5 py-2 rounded-xl text-xs font-bold flex items-center gap-1.5 shadow relative">
                    <i class="fa-solid fa-shopping-bag text-sm"></i> Carrinho 
                    <span id="contador-carrinho-topo" class="bg-white text-red-600 text-[10px] font-black px-1.5 py-0.2 rounded-full">0</span>
                </button>
            </div>
        </div>

        <!-- Campo de Busca Rápida -->
        <div class="max-w-4xl mx-auto px-4 pb-3">
            <div class="relative">
                <i class="fa-solid fa-magnifying-glass absolute left-3 top-3 text-slate-400 text-sm"></i>
                <input type="text" id="campo-busca" oninput="buscarProdutos(this.value)" placeholder="Buscar peça (ex: óleo, cabo, relação)..." class="w-full bg-slate-900 text-white placeholder-slate-400 pl-9 pr-4 py-2 rounded-xl text-sm border border-slate-700 focus:outline-none focus:border-red-500">
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-4xl mx-auto px-4 py-4">
        
        <!-- Categorias em Carrossel Touch -->
        <div class="flex gap-2 overflow-x-auto pb-3 mb-4 scrollbar-none">
            <button onclick="filtrarProdutos('todos', this)" class="btn-categoria active bg-red-600 text-white px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap shadow-sm">Todos os Itens</button>
            <button onclick="filtrarProdutos('pecas', this)" class="btn-categoria bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap">Peças Gerais</button>
            <button onclick="filtrarProdutos('motor', this)" class="btn-categoria bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap">Motor & Válvulas</button>
            <button onclick="filtrarProdutos('lubrificante', this)" class="btn-categoria bg-slate-800 text-slate-300 border border-slate-700 px-4 py-2.5 rounded-xl text-xs font-semibold whitespace-nowrap">Óleos & Fluidos</button>
        </div>

        <!-- Vitrine de Produtos -->
        <div id="vitrine-produtos" class="grid grid-cols-2 sm:grid-cols-3 md:grid-cols-4 gap-3">
            <!-- Injetado via JS -->
        </div>

    </main>

    <!-- Barra de Navegação Inferior (Mobile Fixa) -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-800/95 backdrop-blur-md border-t border-slate-700 p-2 z-40 md:hidden flex justify-around items-center">
        <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center text-slate-400 active:text-red-400 p-2">
            <i class="fa-solid fa-house text-lg"></i>
            <span class="text-[10px] mt-0.5">Início</span>
        </button>
        <button onclick="toggleCarrinho()" class="flex flex-col items-center text-slate-400 active:text-red-400 p-2 relative">
            <i class="fa-solid fa-cart-shopping text-lg"></i>
            <span class="text-[10px] mt-0.5">Carrinho</span>
            <span id="badge-carrinho-mobile" class="absolute top-1 right-2 bg-red-600 text-white text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center">0</span>
        </button>
        <button onclick="abrirPainelAdm()" class="flex flex-col items-center text-slate-400 active:text-red-400 p-2">
            <i class="fa-solid fa-chart-line text-lg"></i>
            <span class="text-[10px] mt-0.5">Vendas</span>
        </button>
    </div>

    <!-- Modal do Carrinho Completo -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/70 hidden justify-end z-50 backdrop-blur-xs">
        <div class="bg-slate-800 text-slate-100 w-full max-w-md h-full p-5 flex flex-col shadow-2xl border-l border-slate-700">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2"><i class="fa-solid fa-cart-shopping text-red-500"></i> Carrinho de Compras</h2>
                <button onclick="toggleCarrinho()" class="text-slate-400 hover:text-white text-2xl p-2">&times;</button>
            </div>
            
            <div id="lista-carrinho" class="flex-1 overflow-y-auto py-3 space-y-2.5">
                <!-- Itens -->
            </div>

            <div class="border-t border-slate-700 pt-3 space-y-3">
                <div class="flex justify-between font-bold text-base">
                    <span>Total do Pedido:</span>
                    <span id="valor-total" class="text-red-400">R$ 0,00</span>
                </div>
                <button onclick="finalizarPedido()" class="w-full bg-green-600 active:bg-green-700 text-white py-3.5 rounded-xl font-bold shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Enviar Pedido via WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Painel do Tio -->
    <div id="modal-adm" class="fixed inset-0 bg-black/80 hidden items-center justify-center z-50 p-3 backdrop-blur-xs">
        <div class="bg-slate-800 border border-slate-700 w-full max-w-lg rounded-2xl p-4 shadow-2xl flex flex-col max-h-[92vh]">
            <div class="flex justify-between items-center border-b border-slate-700 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-red-500"></i> Controle do Tio
                </h2>
                <button onclick="fecharPainelAdm()" class="text-slate-400 text-2xl p-2">&times;</button>
            </div>

            <!-- Tela de Senha -->
            <div id="bloco-senha" class="py-8 text-center space-y-4">
                <p class="text-slate-300 text-sm">Digite a senha para ver os ganhos:</p>
                <div class="flex flex-col gap-2 max-w-xs mx-auto">
                    <input type="password" id="input-senha" inputmode="numeric" placeholder="Senha (padrão: 1234)" class="bg-slate-900 border border-slate-700 px-4 py-3 rounded-xl text-center text-white text-lg focus:outline-none focus:border-red-500">
                    <button onclick="verificarSenha()" class="bg-red-600 active:bg-red-700 text-white py-3 rounded-xl font-bold">Entrar no Painel</button>
                </div>
                <p id="erro-senha" class="text-red-400 text-xs hidden">Senha incorreta!</p>
            </div>

            <!-- Conteúdo do Painel -->
            <div id="bloco-conteudo-adm" class="hidden flex-1 overflow-y-auto space-y-4 pt-3 pr-1">
                
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-[10px] text-slate-400 block font-medium">Hoje</span>
                        <h3 id="relatorio-hoje" class="text-sm font-bold text-white mt-1">R$ 0,00</h3>
                    </div>
                    <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-[10px] text-slate-400 block font-medium">Semana</span>
                        <h3 id="relatorio-semana" class="text-sm font-bold text-white mt-1">R$ 0,00</h3>
                    </div>
                    <div class="bg-slate-900 p-2.5 rounded-xl border border-slate-700">
                        <span class="text-[10px] text-slate-400 block font-medium">Mês</span>
                        <h3 id="relatorio-mes" class="text-sm font-bold text-emerald-400 mt-1">R$ 0,00</h3>
                    </div>
                </div>

                <div class="bg-emerald-950/40 border border-emerald-500/30 p-3 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-[10px] text-emerald-400 font-bold uppercase">Lucro do Mês</span>
                        <h4 id="relatorio-lucro" class="text-xl font-black text-emerald-300">R$ 0,00</h4>
                    </div>
                    <i class="fa-solid fa-sack-dollar text-2xl text-emerald-500/40"></i>
                </div>

                <div class="bg-slate-900/80 p-3 rounded-xl border border-slate-700 space-y-2">
                    <span class="text-xs font-bold text-slate-200 block">Vendeu no Balcão? (Reg. Rápido):</span>
                    <div class="flex gap-2">
                        <input type="number" id="venda-manual-valor" placeholder="Valor R$" class="bg-slate-800 border border-slate-700 px-3 py-2 rounded-lg text-white w-full text-sm">
                        <button onclick="registrarVendaBalcao()" class="bg-emerald-600 active:bg-emerald-700 text-white px-4 py-2 rounded-lg text-xs font-bold whitespace-nowrap">Lançar</button>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-slate-300 text-xs">Histórico de Vendas</h4>
                        <button onclick="limparHistorico()" class="text-[11px] text-red-400 hover:underline">Limpar Tudo</button>
                    </div>
                    <div id="lista-historico-vendas" class="space-y-1.5 max-h-48 overflow-y-auto bg-slate-900/60 p-2 rounded-xl border border-slate-700/60">
                        <!-- Histórico via JS -->
                    </div>
                </div>

            </div>
        </div>
    </div>

    <!-- Arquivo JavaScript Separado -->
    <script src="script.js"></script>
</body>
</html>
