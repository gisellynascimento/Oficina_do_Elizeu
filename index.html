<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Oficina do Elizeu</title>
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans pb-24 md:pb-8 select-none">

    <!-- Topo Informativo (Status e Endereço) -->
    <div class="bg-slate-900 border-b border-slate-800 px-4 py-2 text-xs text-slate-400">
        <div class="max-w-6xl mx-auto flex justify-between items-center">
            <div class="flex items-center gap-1.5">
                <span class="w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <span class="text-slate-200 font-medium">Oficina Aberta</span>
            </div>
            <a href="https://maps.google.com" target="_blank" class="text-red-400 font-semibold flex items-center gap-1 hover:text-red-300 transition">
                <i class="fa-solid fa-location-dot"></i> Como Chegar
            </a>
        </div>
    </div>

    <!-- Cabeçalho Principal -->
    <header class="bg-slate-900/90 border-b border-slate-800 sticky top-0 z-40 backdrop-blur-md shadow-md">
        <div class="max-w-6xl mx-auto px-4 py-3 flex flex-col md:flex-row md:items-center md:justify-between gap-3">
            <div class="flex justify-between items-center">
                <div class="flex items-center gap-2.5">
                    <div class="bg-gradient-to-br from-red-600 to-red-700 text-white w-10 h-10 rounded-2xl flex items-center justify-center shadow-lg shadow-red-900/40">
                        <i class="fa-solid fa-screwdriver-wrench text-lg"></i>
                    </div>
                    <div>
                        <h1 class="text-base font-extrabold text-white leading-none">PEÇAS DO TIO</h1>
                        <span class="text-[10px] text-slate-400 block mt-0.5 font-medium">Oficina & Motopeças</span>
                    </div>
                </div>

                <!-- Botão do Painel e Carrinho no Mobile -->
                <div class="flex md:hidden items-center gap-2">
                    <button onclick="abrirPainelAdm()" class="bg-slate-800 active:bg-slate-700 text-slate-200 px-3 py-2 rounded-xl text-xs font-bold border border-slate-700 flex items-center gap-1.5 shadow-sm">
                        <i class="fa-solid fa-lock text-red-500"></i> Painel
                    </button>
                </div>
            </div>

            <!-- Campo de Busca e Ações para Telas Maiores -->
            <div class="flex items-center gap-3 w-full md:w-auto">
                <div class="relative flex-1 md:w-80">
                    <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-3.5 text-slate-500 text-sm"></i>
                    <input type="text" id="campo-busca" oninput="buscarProdutos(this.value)" placeholder="Buscar peça ou modelo (ex: CG, Bros)..." class="w-full bg-slate-950 text-white placeholder-slate-500 pl-10 pr-4 py-2.5 rounded-xl text-sm border border-slate-800 focus:outline-none focus:border-red-600">
                </div>

                <!-- Botões para Desktop -->
                <div class="hidden md:flex items-center gap-2">
                    <button onclick="abrirPainelAdm()" class="bg-slate-800 hover:bg-slate-700 text-slate-200 px-4 py-2.5 rounded-xl text-xs font-bold border border-slate-700 flex items-center gap-1.5 transition">
                        <i class="fa-solid fa-lock text-red-500"></i> Painel
                    </button>
                    <button onclick="toggleCarrinho()" class="bg-red-600 hover:bg-red-700 text-white px-4 py-2.5 rounded-xl text-xs font-bold flex items-center gap-2 shadow-lg transition relative">
                        <i class="fa-solid fa-cart-shopping"></i> Carrinho
                        <span id="badge-carrinho-desktop" class="bg-white text-red-600 text-[10px] font-black px-1.5 py-0.5 rounded-full">0</span>
                    </button>
                </div>
            </div>
        </div>
    </header>

    <!-- Conteúdo Principal -->
    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
        
        <!-- Categorias -->
        <div class="flex gap-2 overflow-x-auto pb-1 scrollbar-none">
            <button onclick="filtrarProdutos('todos', this)" class="btn-categoria active bg-red-600 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap shadow-md">Todas</button>
            <button onclick="filtrarProdutos('pecas', this)" class="btn-categoria bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap hover:bg-slate-800">Peças</button>
            <button onclick="filtrarProdutos('motor', this)" class="btn-categoria bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap hover:bg-slate-800">Motor</button>
            <button onclick="filtrarProdutos('lubrificante', this)" class="btn-categoria bg-slate-900 text-slate-300 border border-slate-800 px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap hover:bg-slate-800">Óleos</button>
        </div>

        <!-- Vitrine de Produtos (Adaptável: 1 Coluna no Mobile, 2 no Tablet, 3 a 4 no PC) -->
        <div id="vitrine-produtos" class="grid grid-cols-1 sm:grid-cols-2 md:grid-cols-3 lg:grid-cols-4 gap-4">
            <!-- Cards injetados via JS -->
        </div>

    </main>

    <!-- Barra Fixa Inferior (Apenas para Mobile) -->
    <div class="fixed bottom-0 left-0 right-0 bg-slate-900/95 border-t border-slate-800 p-2 z-40 backdrop-blur-md md:hidden">
        <div class="max-w-md mx-auto flex justify-around items-center">
            <button onclick="window.scrollTo({top:0, behavior:'smooth'})" class="flex flex-col items-center text-slate-400 active:text-red-500 py-1 px-4">
                <i class="fa-solid fa-motorcycle text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Catálogo</span>
            </button>
            <button onclick="toggleCarrinho()" class="flex flex-col items-center text-slate-400 active:text-red-500 py-1 px-4 relative">
                <i class="fa-solid fa-cart-shopping text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Carrinho</span>
                <span id="badge-carrinho-mobile" class="absolute -top-1 right-2 bg-red-600 text-white text-[10px] font-black w-5 h-5 rounded-full flex items-center justify-center border-2 border-slate-900">0</span>
            </button>
            <button onclick="abrirPainelAdm()" class="flex flex-col items-center text-slate-400 active:text-red-500 py-1 px-4">
                <i class="fa-solid fa-chart-pie text-lg"></i>
                <span class="text-[10px] font-bold mt-1">Vendas</span>
            </button>
        </div>
    </div>

    <!-- Modal do Carrinho -->
    <div id="modal-carrinho" class="fixed inset-0 bg-black/80 hidden justify-end z-50 backdrop-blur-sm">
        <div class="bg-slate-900 text-slate-100 w-full max-w-md h-full p-5 flex flex-col border-l border-slate-800 shadow-2xl">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-cart-shopping text-red-500"></i> Seu Pedido
                </h2>
                <button onclick="toggleCarrinho()" class="text-slate-400 hover:text-white text-2xl p-1">&times;</button>
            </div>
            
            <div id="lista-carrinho" class="flex-1 overflow-y-auto py-3 space-y-3">
                <!-- Itens -->
            </div>

            <!-- Seleção de Entrega / Retirada -->
            <div class="border-t border-slate-800 pt-3 space-y-3">
                <div>
                    <label class="text-xs font-bold text-slate-400 block mb-1.5">Forma de Recebimento:</label>
                    <div class="grid grid-cols-2 gap-2">
                        <button id="btn-retirar" onclick="selecionarEntrega('retirar')" class="opcao-entrega active bg-red-600 text-white py-2 rounded-xl text-xs font-bold border border-red-500">Retirar no Balcão</button>
                        <button id="btn-entregar" onclick="selecionarEntrega('entregar')" class="opcao-entrega bg-slate-800 text-slate-400 py-2 rounded-xl text-xs font-bold border border-slate-700">Entrega Motoboy</button>
                    </div>
                </div>

                <div class="flex justify-between items-center font-bold text-base pt-1">
                    <span class="text-slate-300">Total:</span>
                    <span id="valor-total" class="text-xl font-black text-emerald-400">R$ 0,00</span>
                </div>

                <button onclick="finalizarPedido()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-3.5 rounded-xl font-extrabold shadow-lg flex items-center justify-center gap-2 active:scale-[0.98] transition">
                    <i class="fa-brands fa-whatsapp text-xl"></i> Enviar para o WhatsApp
                </button>
            </div>
        </div>
    </div>

    <!-- Modal Painel de Controle -->
    <div id="modal-adm" class="fixed inset-0 bg-black/85 hidden items-center justify-center z-50 p-3 backdrop-blur-sm">
        <div class="bg-slate-900 border border-slate-800 w-full max-w-md rounded-2xl p-4 shadow-2xl flex flex-col max-h-[92vh]">
            <div class="flex justify-between items-center border-b border-slate-800 pb-3">
                <h2 class="text-base font-bold text-white flex items-center gap-2">
                    <i class="fa-solid fa-chart-pie text-red-500"></i> Painel do Tio
                </h2>
                <button onclick="fecharPainelAdm()" class="text-slate-400 hover:text-white text-2xl p-1">&times;</button>
            </div>

            <!-- Tela de Senha -->
            <div id="bloco-senha" class="py-8 text-center space-y-4">
                <i class="fa-solid fa-user-lock text-3xl text-red-500/80"></i>
                <p class="text-slate-300 text-xs">Digite a senha para gerenciar ganhos:</p>
                <div class="flex flex-col gap-2 max-w-xs mx-auto">
                    <input type="password" id="input-senha" inputmode="numeric" placeholder="Senha" class="bg-slate-950 border border-slate-800 px-4 py-3 rounded-xl text-center text-white text-lg focus:outline-none focus:border-red-600">
                    <button onclick="verificarSenha()" class="bg-red-600 hover:bg-red-700 text-white py-3 rounded-xl font-bold text-sm">Acessar Painel</button>
                </div>
                <p id="erro-senha" class="text-red-400 text-xs hidden font-bold">Senha incorreta!</p>
            </div>

            <!-- Conteúdo do Painel -->
            <div id="bloco-conteudo-adm" class="hidden flex-1 overflow-y-auto space-y-4 pt-3">
                <div class="grid grid-cols-3 gap-2 text-center">
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 block font-bold uppercase">Hoje</span>
                        <h3 id="relatorio-hoje" class="text-sm font-black text-white mt-0.5">R$ 0,00</h3>
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 block font-bold uppercase">Semana</span>
                        <h3 id="relatorio-semana" class="text-sm font-black text-white mt-0.5">R$ 0,00</h3>
                    </div>
                    <div class="bg-slate-950 p-2.5 rounded-xl border border-slate-800">
                        <span class="text-[10px] text-slate-500 block font-bold uppercase">Mês</span>
                        <h3 id="relatorio-mes" class="text-sm font-black text-emerald-400 mt-0.5">R$ 0,00</h3>
                    </div>
                </div>

                <div class="bg-emerald-950/30 border border-emerald-500/30 p-3 rounded-xl flex justify-between items-center">
                    <div>
                        <span class="text-[10px] text-emerald-400 font-bold uppercase tracking-wider">Lucro Estimado</span>
                        <h4 id="relatorio-lucro" class="text-xl font-black text-emerald-300">R$ 0,00</h4>
                    </div>
                    <i class="fa-solid fa-wallet text-2xl text-emerald-500/40"></i>
                </div>

                <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2">
                    <span class="text-xs font-bold text-slate-300 block">Lançar Venda no Balcão:</span>
                    <div class="flex gap-2">
                        <input type="number" id="venda-manual-valor" placeholder="Valor R$" class="bg-slate-900 border border-slate-800 px-3 py-2 rounded-xl text-white w-full text-sm">
                        <button onclick="registrarVendaBalcao()" class="bg-emerald-600 hover:bg-emerald-700 text-white px-4 py-2 rounded-xl text-xs font-bold whitespace-nowrap">Lançar</button>
                    </div>
                </div>

                <div>
                    <div class="flex justify-between items-center mb-2">
                        <h4 class="font-bold text-slate-300 text-xs">Histórico de Pedidos</h4>
                        <button onclick="limparHistorico()" class="text-[11px] text-red-400 font-semibold hover:underline">Limpar</button>
                    </div>
                    <div id="lista-historico-vendas" class="space-y-1.5 max-h-40 overflow-y-auto bg-slate-950 p-2 rounded-xl border border-slate-800">
                        <!-- Histórico via JS -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
